name: Material Sovereignty resilience review
on:
  push:
    branches: [review/resilience-applied]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8080 >/tmp/material-http.log 2>&1 &
          node scripts/resilience-check.cjs
